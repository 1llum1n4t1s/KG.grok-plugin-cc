name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # 容量境界の実機テストに加え、依存関係の導入とビルドの時間を確保する。
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'

      # このリポジトリの lockfile は pnpm-lock.yaml のみ。
      # npm ci は package-lock.json が要るので使えない。
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check committed JavaScript against TypeScript
        run: pnpm check-generated

      - name: Run build
        run: pnpm build

      - name: Run test suite
        run: pnpm test

      - name: Check manifest versions
        run: pnpm check-version

  node-22-smoke:
    name: Node.js 22.0 distribution smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.0.0'
      - name: Test committed distribution on Node.js 22.0
        run: node --test --test-concurrency=4 tests/foreground-bridge-e2e.test.mjs tests/runtime.test.mjs

  windows-boundaries:
    name: Windows process and snapshot boundaries
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up pinned Rust and Windows targets
        run: rustup toolchain install 1.97.1 --profile minimal --target i686-pc-windows-msvc,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Check committed JavaScript against TypeScript
        run: pnpm check-generated
      - name: Check committed native distribution against Rust
        run: pnpm check:native
      - name: Prepare isolated native Git fixture root
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.resolve(fs.mkdtempSync(path.join(path.resolve(process.env.RUNNER_TEMP), 'grok-git-native-')));
          fs.appendFileSync(process.env.GITHUB_ENV, `GROK_GIT_NATIVE_FIXTURE_ROOT=${root}\n`);
          NODE
      # pnpm test builds the native fixture shim, runs Rust unit tests, and passes
      # GROK_TEST_SHIM to the real process ownership and Git boundary tests.
      # Exercise checked-in helper executables; do not replace them before tests.
      - name: Test committed Windows distribution and native boundaries
        run: pnpm test

  windows-architecture-smoke:
    name: Windows distribution smoke (${{ matrix.expected-arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            node-version: '22.0.0'
            node-architecture: x86
            expected-arch: ia32
          - runner: windows-11-arm
            node-version: '26.13.0'
            node-architecture: arm64
            expected-arch: arm64
    defaults:
      run:
        shell: bash
    env:
      GROK_EXPECTED_NODE_ARCH: ${{ matrix.expected-arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up distribution test Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.node-architecture }}
      - name: Assert Windows Node.js architecture
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, process.env.GROK_EXPECTED_NODE_ARCH);
          console.log(`Distribution test: Node ${process.version}, process.arch=${process.arch}`);
          NODE
      # Rust builds only the fixture shim and unit tests for its default host.
      # The Node architecture independently selects the checked-in helper exe.
      - name: Set up Rust for native host fixtures
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup run 1.97.1 rustc -vV
      - name: Build native host shim and prepare fixture paths
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('rustup', ['run', '1.97.1', 'cargo', 'build', '--locked',
            '--manifest-path', 'plugins/grok/native/Cargo.toml', '--bin', 'grok-test-shim',
            '--message-format=json-render-diagnostics'], {
            encoding: 'utf8', shell: false, windowsHide: true, maxBuffer: 16 * 1024 * 1024,
          });
          if (result.stderr) process.stderr.write(result.stderr);
          if (result.error) throw result.error;
          let shim;
          for (const line of result.stdout.split(/\r?\n/).filter(Boolean)) {
            const message = JSON.parse(line);
            if (message.reason === 'compiler-message' && message.message?.rendered) {
              process.stderr.write(message.message.rendered);
            }
            if (message.reason === 'compiler-artifact' && message.target?.name === 'grok-test-shim' && message.executable) {
              shim = path.resolve(message.executable);
            }
          }
          assert.equal(result.status, 0, 'Native host shim build must succeed');
          assert.ok(shim && path.isAbsolute(shim) && fs.statSync(shim).isFile(), 'Cargo must emit an absolute shim path');
          const fixture = path.resolve(fs.mkdtempSync(path.join(path.resolve(process.env.RUNNER_TEMP), 'grok-git-native-')));
          fs.appendFileSync(process.env.GITHUB_ENV, `GROK_TEST_SHIM=${shim}\nGROK_GIT_NATIVE_FIXTURE_ROOT=${fixture}\n`);
          console.log(`Host fixture shim: ${shim}; distribution architecture: ${process.arch}`);
          NODE
      - name: Test native host helper units
        run: rustup run 1.97.1 cargo test --locked --manifest-path plugins/grok/native/Cargo.toml --bin grok-windows-helper
      # Do not run build:native: these tests must execute the committed exe.
      - name: Test committed distribution process and Git boundaries
        run: >-
          node --test --test-concurrency=2
          tests/foreground-owned-process-e2e.test.mjs
          tests/windows-owned-process-e2e.test.mjs
          tests/git-missing-directory-native.test.mjs
          tests/windows-agent-control.test.mjs
          tests/acp.test.mjs
